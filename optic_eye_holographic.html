<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Holographic Optic Eye</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #040608;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }
    #opticEyeStage {
      width: 520px;
      height: 340px;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="opticEyeStage">
    <canvas id="opticCanvas"></canvas>
  </div>
  <h1 style="margin-top: 10px; font-size: 32px; font-weight: 900; letter-spacing: -0.5px;">
    <span style="color: #7182FF;">OPTIC</span> CHEATS
  </h1>

  <script>
    const canvas = document.getElementById('opticCanvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, 520 / 340, 0.1, 100);
    camera.position.set(0, 0, 7.8);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(520, 340);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const masterGroup = new THREE.Group();
    scene.add(masterGroup);

    const textureLoader = new THREE.TextureLoader();

    // 1. Ambient Background Halo
    const haloGeo = new THREE.PlaneGeometry(5.8, 5.8);
    const haloCanvas = document.createElement('canvas');
    haloCanvas.width = haloCanvas.height = 256;
    const hctx = haloCanvas.getContext('2d');
    const grad = hctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(113, 130, 255, 0.45)');
    grad.addColorStop(0.45, 'rgba(113, 130, 255, 0.15)');
    grad.addColorStop(1, 'rgba(113, 130, 255, 0)');
    hctx.fillStyle = grad;
    hctx.fillRect(0, 0, 256, 256);
    const haloTex = new THREE.CanvasTexture(haloCanvas);
    const haloMat = new THREE.MeshBasicMaterial({ map: haloTex, transparent: true, blending: THREE.AdditiveBlending });
    const haloMesh = new THREE.Mesh(haloGeo, haloMat);
    haloMesh.position.z = -0.6;
    masterGroup.add(haloMesh);

    // 2. Gyro Orbit Rings
    const gyroGeo = new THREE.TorusGeometry(2.5, 0.012, 16, 100);
    const gyroMat = new THREE.MeshBasicMaterial({ color: 0x7182FF, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
    const gyroRing = new THREE.Mesh(gyroGeo, gyroMat);
    gyroRing.rotation.x = Math.PI / 2.5;
    masterGroup.add(gyroRing);

    const gyroRing2 = new THREE.Mesh(new THREE.TorusGeometry(2.25, 0.008, 16, 80), gyroMat);
    gyroRing2.rotation.y = Math.PI / 3;
    masterGroup.add(gyroRing2);

    // 3. Inner 3D Pupil Crescent (Parallax layer)
    const pupilGroup = new THREE.Group();
    pupilGroup.position.z = -0.15;
    masterGroup.add(pupilGroup);

    bladesTex.minFilter = THREE.LinearFilter;
    const bladesMat = new THREE.MeshBasicMaterial({
      map: bladesTex,
      transparent: true,
      opacity: 0.98
    });
    const bladesPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 4.8), bladesMat);
    bladesPlane.position.z = 0.25;
    masterGroup.add(bladesPlane);

    // Dynamic Point Light
    const pLight = new THREE.PointLight(0x7182FF, 3.5, 15);
    pLight.position.set(0, 0, 2);
    masterGroup.add(pLight);

    // Mouse Tracking Physics with Parallax
    let mouseX = 0, mouseY = 0;
    let targetEyeRotX = 0, targetEyeRotY = 0;
    let targetPupilX = 0, targetPupilY = 0;

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      mouseX = (e.clientX - cx) / (window.innerWidth / 2);
      mouseY = (e.clientY - cy) / (window.innerHeight / 2);

      // Eye tilts towards cursor in 3D
      targetEyeRotY = mouseX * 0.45;
      targetEyeRotX = -mouseY * 0.35;

      // Pupil independently slides in 3D parallax to look at cursor
      targetPupilX = mouseX * 0.45;
      targetPupilY = -mouseY * 0.35;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Smooth interpolation for master eye tilt
      masterGroup.rotation.y += (targetEyeRotY - masterGroup.rotation.y) * 0.08;
      masterGroup.rotation.x += (targetEyeRotX - masterGroup.rotation.x) * 0.08;

      // 3D Parallax Pupil Tracking
      pupilGroup.position.x += (targetPupilX - pupilGroup.position.x) * 0.1;
      pupilGroup.position.y += (targetPupilY - pupilGroup.position.y) * 0.1;

      // Subtle breathing float & gyro spin
      masterGroup.position.y = Math.sin(t * 1.5) * 0.12;
      gyroRing.rotation.z = t * 0.2;
      gyroRing2.rotation.x = t * -0.15;
      
      // Pupil subtle breathing pulse
      const s = 1.0 + Math.sin(t * 2.2) * 0.025;
      pupilGroup.scale.set(s, s, s);

      renderer.render(scene, camera);
    }
    animate();
  </script>
